name: Jimvio CJ Stock Health

on:
  schedule:
    - cron: "10,40 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jimvio-cj-stock-health
  cancel-in-progress: false

jobs:
  stock-health:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Validate cron secret
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Add the GitHub Actions secret CRON_SECRET with the same value as Vercel Production CRON_SECRET."
            exit 1
          fi

      - name: Run CJ stock health monitor
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --location --fail-with-body --silent --show-error \
            --max-time 330 --retry 1 --retry-delay 5 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://www.jimvio.com/api/cron/cj-stock-health"
