name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: Build · Lint · Typecheck · Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Workflow / Dependabot structure
        run: node scripts/release/verify-workflows.mjs

      - name: Dependency audit (critical)
        run: npm audit --audit-level=critical

      - name: Dependency audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        continue-on-error: true

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Pre-push CI gate
        id: prepush
        run: npm run ci:prepush
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          # Build-time placeholders so Next.js can collect page data without secrets.
          # Production runtime uses Vercel/project env — these must not be real credentials.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsYWNlaG9sZGVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE2NDUxOTI4MDAsImV4cCI6MTk2MDc2ODgwMH0.placeholder
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsYWNlaG9sZGVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE2NDUxOTI4MDAsImV4cCI6MTk2MDc2ODgwMH0.placeholder
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsYWNlaG9sZGVyIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTY0NTE5MjgwMCwiZXhwIjoxOTYwNzY4ODAwfQ.placeholder
          SUPABASE_SECRET_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsYWNlaG9sZGVyIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTY0NTE5MjgwMCwiZXhwIjoxOTYwNzY4ODAwfQ.placeholder
          NEXT_PUBLIC_APP_URL: https://jimvio.example
          CRON_SECRET: ci-build-placeholder-cron-secret

      - name: Migration verification
        run: node scripts/release/verify-migrations.mjs

      - name: Environment documentation check
        run: node scripts/release/verify-env.mjs

      - name: Performance report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report-${{ github.run_id }}
          path: |
            .next/performance-report.json
            .next/build-timing.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ github.run_id }}
          path: |
            .next/trace
            .next/diagnostics
          if-no-files-found: ignore
          retention-days: 14

      - name: Observability summary
        if: always()
        run: |
          {
            echo "### CI observability"
            echo "- ref: \`${{ github.sha }}\`"
            echo "- event: \`${{ github.event_name }}\`"
            echo "- prepush: \`${{ steps.prepush.outcome }}\`"
            if [ -f .next/performance-report.json ]; then
              echo "- performance report: present"
              echo '```json'
              cat .next/performance-report.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
