name: Supabase migration checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrations:
    name: Verify remote migration history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify local numbered migrations
        run: node scripts/release/verify-migrations.mjs

      - name: Verify production migration names
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]] && missing+=("SUPABASE_ACCESS_TOKEN")
          [[ -z "${SUPABASE_PROJECT_REF:-}" ]] && missing+=("SUPABASE_PROJECT_REF")
          if ((${#missing[@]} > 0)); then
            echo "::error::Missing required GitHub Actions secrets: ${missing[*]}"
            {
              echo "### Supabase migration checks"
              echo "- Status: **failed — missing secrets**"
              echo "- Required: \`SUPABASE_ACCESS_TOKEN\`, \`SUPABASE_PROJECT_REF\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          node scripts/release/verify-remote-migration-history.mjs
          {
            echo "### Supabase migration checks"
            echo "- Status: production migration names verified via Management API"
            echo "- Project: \`$SUPABASE_PROJECT_REF\`"
            echo "- Timestamp drift from MCP apply_migration is allowed; historical SQL is not rerun"
          } >> "$GITHUB_STEP_SUMMARY"
