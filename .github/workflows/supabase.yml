name: Supabase migration checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrations:
    name: Verify remote migration history
    runs-on: ${{ vars.USE_GITHUB_HOSTED_RUNNERS == 'false' && fromJSON('["self-hosted", "linux", "x64"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify linked migration history
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]] && missing+=("SUPABASE_ACCESS_TOKEN")
          [[ -z "${SUPABASE_PROJECT_REF:-}" ]] && missing+=("SUPABASE_PROJECT_REF")

          if ((${#missing[@]} > 0)); then
            echo "::error::Missing required GitHub Actions secrets: ${missing[*]}"
            {
              echo "### Supabase migration checks"
              echo "- Status: **failed — missing secrets**"
              echo "- Required: \`SUPABASE_ACCESS_TOKEN\`, \`SUPABASE_PROJECT_REF\`"
              echo "- Optional: \`SUPABASE_DB_PASSWORD\`"
              echo "- Local equivalent: \`npm run ci:verify\` (see docs/CI_SELF_HOSTED.md)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Linking project ${SUPABASE_PROJECT_REF}…"
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

          echo "Listing local vs remote migrations…"
          if LIST_OUT=$(supabase migration list --linked --output-format json 2>&1); then
            echo "$LIST_OUT"
            printf '%s' "$LIST_OUT" > /tmp/migration-list.out
          else
            echo "$LIST_OUT"
            echo "::error::supabase migration list failed"
            exit 1
          fi

          python3 - <<'PY'
          import json, pathlib, sys
          raw = pathlib.Path("/tmp/migration-list.out").read_text()
          start = raw.find("{")
          if start < 0:
              lines = [ln for ln in raw.splitlines() if ln.strip()]
              print("Non-JSON migration list output; command succeeded.")
              print("\n".join(lines[-20:]))
              sys.exit(0)
          data = json.loads(raw[start:])
          bad = []
          for m in data.get("migrations", []):
              local = m.get("local") or ""
              remote = m.get("remote") or ""
              if local != remote:
                  bad.append(f"local={local!r} remote={remote!r}")
          if bad:
              print("Migration history mismatches:")
              for line in bad:
                  print(" -", line)
              sys.exit(1)
          print(f"Migration history OK ({len(data.get('migrations', []))} versions aligned).")
          PY

          {
            echo "### Supabase migration checks"
            echo "- Status: local/remote migration history aligned"
            echo "- Project: \`$SUPABASE_PROJECT_REF\`"
          } >> "$GITHUB_STEP_SUMMARY"
