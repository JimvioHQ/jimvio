name: Supabase migration checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  migrations:
    name: Verify remote migration history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Verify linked migration history
        shell: bash
        run: |
          if [[ -z "${SUPABASE_ACCESS_TOKEN}" || -z "${SUPABASE_PROJECT_REF}" ]]; then
            echo "::warning::Skipping remote Supabase checks: SUPABASE_ACCESS_TOKEN and/or SUPABASE_PROJECT_REF is not configured."
            {
              echo "### Supabase migration checks"
              echo "- Status: skipped"
              echo "- Required secrets: \`SUPABASE_ACCESS_TOKEN\`, \`SUPABASE_PROJECT_REF\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase migration list
          {
            echo "### Supabase migration checks"
            echo "- Status: linked project migration history verified"
          } >> "$GITHUB_STEP_SUMMARY"
