name: Supabase migration checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrations:
    name: Verify migration files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify local numbered migrations
        run: node scripts/release/verify-migrations.mjs

      - name: Verify Supabase migration files
        run: node scripts/release/verify-supabase-migrations.mjs

  apply:
    name: Verify and apply eligible production migrations
    needs: migrations
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: supabase-production-migrate
      cancel-in-progress: false
    environment:
      name: production
      url: https://www.jimvio.com
    env:
      # These credentials are intentionally read only by this trusted main-branch
      # production-environment job. Pull-request jobs never receive production secrets.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      APPLY_MIGRATIONS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify production migration history
        run: node scripts/release/verify-remote-migration-history.mjs

      - name: Validate pending migrations
        run: node scripts/release/verify-pending-migrations.mjs

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Apply allowlisted migrations
        run: node scripts/release/apply-eligible-migrations.mjs
