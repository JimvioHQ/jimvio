name: Supabase migration checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrations:
    name: Verify migration history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Canonical project secret: SUPABASE_PROJECT_REF.
      # SUPABASE_PROJECT_ID remains in GitHub and is not read.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify local numbered migrations
        run: node scripts/release/verify-migrations.mjs

      - name: Verify Supabase migration files
        run: node scripts/release/verify-supabase-migrations.mjs

      - name: Verify production migration history
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]] && missing+=("SUPABASE_ACCESS_TOKEN")
          [[ -z "${SUPABASE_PROJECT_REF:-}" ]] && missing+=("SUPABASE_PROJECT_REF")
          if ((${#missing[@]} > 0)); then
            echo "::error::Missing required GitHub Actions secrets: ${missing[*]}. Canonical project secret is SUPABASE_PROJECT_REF. SUPABASE_PROJECT_ID is not used."
            {
              echo "### Supabase migration checks"
              echo "- Status: **failed — missing secrets**"
              echo "- Required: \`SUPABASE_ACCESS_TOKEN\`, \`SUPABASE_PROJECT_REF\`"
              echo "- \`SUPABASE_PROJECT_ID\` is not the canonical project secret"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          node scripts/release/verify-remote-migration-history.mjs

      - name: Validate pending migrations
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/verify-pending-migrations.mjs
          {
            echo "### Supabase migration checks"
            echo "- Baseline: remote history has a local file for every recorded version"
            echo "- Pending: only an allowlisted, newer, non-destructive set can continue"
            echo "- Schema changes: not applied by this job"
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply eligible production migrations
    needs: migrations
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: supabase-production-migrate
      cancel-in-progress: false
    environment:
      name: production
      url: https://www.jimvio.com
    env:
      # Canonical project secret: SUPABASE_PROJECT_REF.
      # SUPABASE_PROJECT_ID remains in GitHub and is not read.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      APPLY_MIGRATIONS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Apply allowlisted migrations
        run: node scripts/release/apply-eligible-migrations.mjs
