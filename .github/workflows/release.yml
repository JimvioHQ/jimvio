name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
      - "**.md"
      - "docs/**"
      - "release-checklist.md"
      - "branch-protection.md"
      - "versioning.md"
      - "rollback-playbook.md"
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Run gates only (no production deploy)"
        required: false
        default: false
        type: boolean
      bump:
        description: "Semver bump when tagging"
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  gate:
    name: Release gates
    runs-on: ubuntu-latest
    # Public repository standard hosted runners have free, unlimited usage.
    timeout-minutes: 150
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: CI gate (ci:prepush)
        run: npm run ci:prepush
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          # Build-time placeholders (same as ci.yml) — not production secrets.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsYWNlaG9sZGVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE2NDUxOTI4MDAsImV4cCI6MTk2MDc2ODgwMH0.placeholder
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsYWNlaG9sZGVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE2NDUxOTI4MDAsImV4cCI6MTk2MDc2ODgwMH0.placeholder
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsYWNlaG9sZGVyIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTY0NTE5MjgwMCwiZXhwIjoxOTYwNzY4ODAwfQ.placeholder
          SUPABASE_SECRET_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsYWNlaG9sZGVyIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTY0NTE5MjgwMCwiZXhwIjoxOTYwNzY4ODAwfQ.placeholder
          NEXT_PUBLIC_APP_URL: https://jimvio.example
          CRON_SECRET: ci-build-placeholder-cron-secret

      - name: Migration verification
        run: node scripts/release/verify-migrations.mjs

      - name: Supabase migration files
        run: node scripts/release/verify-supabase-migrations.mjs

      - name: Supabase history match
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/release/verify-remote-migration-history.mjs

      - name: Supabase pending migration approval
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/release/verify-pending-migrations.mjs

      - name: Environment / deploy readiness
        id: env
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
        run: |
          node scripts/release/verify-env.mjs
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Vercel secret names are missing. Vercel Git still publishes main; this workflow will not deploy." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID are set. GitHub Actions will not start a second production deployment." >> "$GITHUB_STEP_SUMMARY"

      - name: Decide deploy
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_deploy }}" = "true" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.env.outputs.configured }}" != "true" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Confirm production
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.gate.result == 'success'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 40
    environment:
      name: production
      url: https://www.jimvio.com
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Wait for Vercel Git production commit
        id: health
        run: |
          set -euo pipefail
          expected="${GITHUB_SHA}"
          for i in $(seq 1 40); do
            body=$(curl -fsS --max-time 20 https://www.jimvio.com/api/ops/health || true)
            version=$(printf '%s' "$body" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{try{const j=JSON.parse(s);if(j&&typeof j.version==="string")process.stdout.write(j.version)}catch{}})')
            if [ "$version" = "$expected" ]; then
              echo "matched=true" >> "$GITHUB_OUTPUT"
              echo "Production health version matches ${expected}." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Waiting for production version ${expected} (attempt ${i}/40)."
            sleep 20
          done
          echo "::error::Production health did not report ${expected}."
          exit 1

      - name: Production smoke
        env:
          BASE_URL: https://www.jimvio.com
        run: node scripts/smoke/critical-flows.mjs

      - name: Semantic version + CHANGELOG + GitHub Release
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          NEXT=$(node -e '
            const bump=process.env.BUMP||"patch";
            const prev=(process.argv[1]||"").replace(/^v/,"");
            let a=1,b=0,c=0;
            if (prev && /^\d+\.\d+\.\d+$/.test(prev)) [a,b,c]=prev.split(".").map(Number);
            else if (!prev) { console.log("v1.0.0"); process.exit(0); }
            if (bump==="major") { a+=1; b=0; c=0; }
            else if (bump==="minor") { b+=1; c=0; }
            else { c+=1; }
            console.log("v"+a+"."+b+"."+c);
          ' "${PREV}")
          {
            echo "# Jimvio $NEXT"
            echo
            echo "Production release from \`${GITHUB_SHA}\`."
            echo
            echo "## Changes"
            if [ -n "${PREV}" ]; then
              git log --pretty=format:'- %s (%h)' "${PREV}..HEAD"
            else
              git log --pretty=format:'- %s (%h)' -30
            fi
            echo
          } > RELEASE_NOTES.md
          {
            echo "## $NEXT — $(date -u +%Y-%m-%d)"
            echo
            cat RELEASE_NOTES.md
            echo
            echo
            if [ -f CHANGELOG.md ]; then cat CHANGELOG.md; fi
          } > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): $NEXT [skip ci]" || true
          git tag -a "$NEXT" -m "Jimvio $NEXT" || true
          git push origin "HEAD:${{ github.ref_name }}" --tags || true
          gh release create "$NEXT" --title "Jimvio $NEXT" --notes-file RELEASE_NOTES.md || true
          echo "Tagged $NEXT" >> "$GITHUB_STEP_SUMMARY"

      - name: Observability metrics
        if: always()
        run: |
          {
            echo "### Release observability"
            echo "- publisher: Vercel Git integration"
            echo "- github_actions_deploy: not run"
            echo "- health: ${{ steps.health.outcome }}"
            echo "- sha: \`${{ github.sha }}\`"
            echo "- public_url: https://www.jimvio.com"
          } >> "$GITHUB_STEP_SUMMARY"
