name: Preview

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional PR number for smoke context"
        required: false
        type: string
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]

concurrency:
  group: preview-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read
  pull-requests: write
  statuses: read

jobs:
  preview:
    name: Deploy Preview · Smoke
    # Expensive: only on dispatch, PR label "preview", or ENABLE_PREVIEW_CI=true
    if: >
      github.event_name == 'workflow_dispatch' ||
      vars.ENABLE_PREVIEW_CI == 'true' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'preview'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build verification
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsYWNlaG9sZGVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE2NDUxOTI4MDAsImV4cCI6MTk2MDc2ODgwMH0.placeholder
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsYWNlaG9sZGVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE2NDUxOTI4MDAsImV4cCI6MTk2MDc2ODgwMH0.placeholder
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsYWNlaG9sZGVyIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTY0NTE5MjgwMCwiZXhwIjoxOTYwNzY4ODAwfQ.placeholder
          SUPABASE_SECRET_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsYWNlaG9sZGVyIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTY0NTE5MjgwMCwiZXhwIjoxOTYwNzY4ODAwfQ.placeholder
          NEXT_PUBLIC_APP_URL: https://jimvio.example
          CRON_SECRET: ci-build-placeholder-cron-secret

      - name: Deploy Vercel Preview (CLI)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "vercel_cli=false" >> "$GITHUB_OUTPUT"
            echo "Vercel CLI secrets not configured — will try GitHub deployment URL." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "vercel_cli=true" >> "$GITHUB_OUTPUT"
          npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx vercel build --token="$VERCEL_TOKEN"
          URL=$(npx vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve preview URL (Vercel Git integration)
        id: resolve
        if: steps.deploy.outputs.url == '' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Waiting for preview deployment URL (up to ~10 minutes)…"
          for i in $(seq 1 60); do
            URL=$(gh api "repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}/statuses" \
              --jq '[.[] | select(.target_url != null and (.target_url | test("vercel\\.app|jimvio"))) | .target_url] | first // empty' 2>/dev/null || true)
            if [ -z "$URL" ]; then
              URL=$(gh api "repos/${{ github.repository }}/deployments?sha=${{ github.event.pull_request.head.sha }}&per_page=10" \
                --jq '[.[].environment_url // empty] | map(select(length>0)) | first // empty' 2>/dev/null || true)
            fi
            if [ -n "$URL" ]; then
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              echo "Resolved preview: $URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Could not resolve preview URL. Set VERCEL_TOKEN/ORG/PROJECT secrets or enable Vercel GitHub integration."
          exit 1

      - name: Set BASE_URL
        id: base
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          if [ -z "$URL" ]; then URL="${{ steps.resolve.outputs.url }}"; fi
          if [ -z "$URL" ]; then
            echo "::error::No preview URL available. Configure Vercel secrets or run on a labeled PR."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Using BASE_URL=$URL"

      - name: Health check preview
        env:
          BASE_URL: ${{ steps.base.outputs.url }}
        run: |
          echo "Probing $BASE_URL/api/ops/health"
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" "$BASE_URL/api/ops/health" || true)
            if [ "$CODE" = "200" ] || [ "$CODE" = "503" ]; then
              cat /tmp/health.json || true
              exit 0
            fi
            sleep 6
          done
          echo "Preview health failed"
          exit 1

      - name: Critical smoke
        env:
          BASE_URL: ${{ steps.base.outputs.url }}
        run: node scripts/smoke/critical-flows.mjs

      - name: Upload smoke artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: preview-smoke-${{ github.event.pull_request.number || github.run_id }}
          path: /tmp/health.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Observability
        if: always()
        run: |
          {
            echo "### Preview observability"
            echo "- event: \`${{ github.event_name }}\`"
            echo "- sha: \`${{ github.sha }}\`"
            echo "- url: ${{ steps.base.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
